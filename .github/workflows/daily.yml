name: Daily prices

# Runs on GitHub's servers every morning, so no computer needs to be on.
# 04:30 UTC = 06:30 in Israel in winter, 07:30 in summer (GitHub may start it a little late).
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Jerusalem
      PREV_CATALOG_URL: https://orenkarev-commits.github.io/groceries-nearby/catalog.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install certifi
      - name: Fetch today's prices from the chains' official price files
        run: python -m grocer.fetch
      - name: Build the site
        run: python -m grocer.publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses scheduled jobs in public repos after 60 days without a commit; a one-line commit keeps it running.
      - name: Keep the schedule alive
        run: |
          date -u +%FT%TZ > data/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-run.txt
          git commit -q -m "Prices $(date +%F)" || true
          git push -q || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
