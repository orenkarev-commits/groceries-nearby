<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E8E5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<meta name="description" content="Grocery prices within a 10 minute walk, with a shopping list that finds the cheapest shop.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Groceries near home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font: 16px/1.45 Rubik, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; background: #E4E8E5; }
@media (prefers-color-scheme: dark) { body { background: #121815; } }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid #1D7449; outline-offset: 2px; }
bdi { unicode-bidi: isolate; }
.boot { padding: 40px 20px; color: #5A6A62; max-width: 1180px; margin: 0 auto; }
.b-pill { display: inline-block; background: var(--c); color: #fff; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.b-pill.light { color: #1d1d1d; }
.p-num { font-weight: 600; }
.p-tag { display: inline-block; background: #FFD84A; color: #2E2500; font-weight: 600; padding: 1px 7px; border-radius: 4px; white-space: nowrap; box-shadow: inset 0 0 0 1px #E5B900; }
.p-tag.club { background: #EDE7FB; color: #46307F; box-shadow: none; }
.cmp-box { position: relative; }
.cmp-input { width: 100%; }
.cmp-pop { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 3000; list-style: none; margin: 0; padding: 6px; max-height: min(60vh, 520px); overflow: auto;
  transform-origin: top center; transition: opacity 150ms cubic-bezier(0.23, 1, 0.32, 1), transform 150ms cubic-bezier(0.23, 1, 0.32, 1); }
.cmp-pop[data-state="closed"] { opacity: 0; transform: scale(0.97) translateY(-4px); pointer-events: none; }
.sg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.sg-main { display: grid; gap: 1px; min-width: 0; }
.sg-he { font-weight: 500; overflow-wrap: anywhere; }
.sg-en { font-size: 13px; opacity: .75; overflow-wrap: anywhere; }
.sg.term .sg-en { font-size: 16px; opacity: 1; font-weight: 600; }
.sg-kind { font-size: 11px; font-weight: 600; letter-spacing: .02em; opacity: .7; }
.sg-n { opacity: .8; }
.sg-side { display: grid; justify-items: end; gap: 3px; }
.sg-from { font-size: 11px; opacity: .6; }
.sg-sep { font-size: 11px; opacity: .6; padding: 8px 10px 2px; }
.sg-refine { padding: 6px 6px 8px; border-bottom: 1px solid rgba(0,0,0,.08); margin-bottom: 4px; }
.sg-unknown { font-size: 12px; opacity: .8; padding: 2px 4px 8px; }
.sg-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sg-chips-l { font-size: 11px; font-weight: 600; opacity: .6; margin-right: 2px; }
.sg-chip { border: 1px solid rgba(0,0,0,.14); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; color: inherit; white-space: nowrap;
  transition: transform 160ms cubic-bezier(0.23,1,0.32,1), background-color 160ms ease, border-color 160ms ease; }
.sg-chip:active { transform: scale(0.96); }
@media (hover: hover) and (pointer: fine) { .sg-chip:hover { border-color: #1D7449; } }
.sg-chip.on { background: #1D7449; border-color: #1D7449; color: #fff; }
.m-home { width: 34px; height: 34px; border-radius: 11px; background: #16231D; color: #F5F7F3; display: grid; place-items: center; font-size: 18px; transform: translate(-50%, -50%); border: 2px solid #fff; box-shadow: 0 6px 14px -6px rgba(0,0,0,.6); }
.dark-tiles .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) saturate(.6); }
.leaflet-container { font: inherit; }
@media (prefers-reduced-motion: reduce) { .cmp-pop { transition: opacity 150ms ease; } .cmp-pop[data-state="closed"] { transform: none; } }
</style>
</head>
<body>
<div id="app"><p class="boot">Loading today's prices…</p></div>
<script src="glossary.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script>
"use strict";
window.PUBLIC_URL = "https://orenkarev-commits.github.io/groceries-nearby/";   // share links made on this Mac point at the phone site
loadAll().then(() => {
  const added = importShared();
  App.mount(document.getElementById("app"));
  if (added) {
    const t = document.querySelector(".v4 .toast");
    if (t) { t.textContent = added > 0 ? `Added ${added} item${added === 1 ? "" : "s"} from the shared list` : "That shared list link is damaged";
      setTimeout(() => t.classList.add("show"), 400); setTimeout(() => t.classList.remove("show"), 2600); }
  }
}).catch(() => {
  document.getElementById("app").innerHTML = `<p class="boot">Couldn't load prices. ${LOCAL ? "Start the app with <b>python3 -m grocer.app</b>, then reload." : "Check the connection and reload."}</p>`;
});
if ("serviceWorker" in navigator && !LOCAL) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
